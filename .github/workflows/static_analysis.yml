name: Проверка исходников
on: [push, pull_request]
permissions:
  contents: read
env:
  GOWORK: "off"
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Go vet
        run: go vet -tags migrated_fynedo,ci ./...
      - name: Форматирование
        shell: bash
        run: |
          files=$(git ls-files '*.go' ':!:**/vendor/**')
          test -z "$(gofmt -l $files)"
