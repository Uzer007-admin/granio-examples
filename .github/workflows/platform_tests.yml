name: Проверка примеров
on: [push, pull_request]
permissions:
  contents: read
env:
  GOWORK: "off"
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.27.1', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Тесты общего модуля
        run: go test -p 1 -race -tags migrated_fynedo,ci -timeout 3m ./...
